project_id = "template-haven"

# Public endpoints (no Supabase auth JWT required).
# paypal-config, paypal-create-order, paypal-capture-order, and get-order
# are called from the storefront; paypal-webhook is called by PayPal's
# servers, which cannot supply a Supabase JWT at all — it verifies
# PayPal's own signature instead (see that function's comment); download
# is opened from emails.
[functions.paypal-config]
verify_jwt = false

[functions.paypal-create-order]
verify_jwt = false

[functions.paypal-capture-order]
verify_jwt = false

[functions.paypal-webhook]
verify_jwt = false

[functions.download]
verify_jwt = false

[functions.get-order]
verify_jwt = false

# get-my-orders backs the /account order history page and requires a
# signed-in caller — unlike everything else above, which guest checkout
# depends on being reachable with no session at all.
[functions.get-my-orders]
verify_jwt = true

# product-stats, submit-review, and newsletter-subscribe are the real
# mechanisms behind what used to be hardcoded review/sales/subscriber
# numbers on the storefront (see the reviews_and_subscribers migration).
# All three are called directly from the browser, guest-checkout style —
# no Supabase auth session is required for any of them.
[functions.product-stats]
verify_jwt = false

[functions.submit-review]
verify_jwt = false

[functions.newsletter-subscribe]
verify_jwt = false
